name: Sync Drive media

on:
  push:
    branches: [arena/019f850c-website]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          ffmpeg -version | head -1

      - name: Sync media from Google Drive
        run: python scripts/sync_media.py

      - name: Commit processed media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media assets/manifest.json
          if git diff --cached --quiet; then
            echo "No media changes."
          else
            git commit -m "chore(media): sync portfolio assets from Google Drive [skip ci]"
            git push
          fi
